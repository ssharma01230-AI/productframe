<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ProductFrame — Run review preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <!-- Standalone copy of run-review.css -->
  <style>
:root {
  color-scheme: light;
  --bg: #f5f5f0;
  --paper: #fff;
  --ink: #171817;
  --muted: #6e726a;
  --line: #e3e4de;
  --accent: #b9ff3d;
  --dark: #1c1d1a;
  --soft: #eeefe8;
  --green: #48651d;
  --red: #925143;
  --ease: cubic-bezier(.2, .8, .2, 1);
  font-family: "DM Sans", sans-serif;
  font-size: 16px;
  color: var(--ink);
  background: var(--bg);
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 2px solid #526c2c; outline-offset: 4px; }
button { color: inherit; }
svg.icon { display: inline-block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.eyebrow { font-size: .75rem; line-height: 1.4; letter-spacing: .085em; text-transform: uppercase; color: var(--muted); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: -.045em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--ink); color: var(--accent); font-size: 16px; }
.workspace { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
.workspace-sidebar { padding: 30px 22px; border-right: 1px solid var(--line); background: #f7f7f3; }
.workspace-nav { display: grid; gap: 7px; margin-top: 52px; }
.workspace-nav span { display: flex; gap: 12px; padding: 13px 12px; color: var(--muted); font-size: 14px; }
.workspace-nav .selected { background: #ebebe4; border-radius: 8px; color: var(--ink); }
.workspace-content > header { height: 78px; padding: 0 42px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #e5e7df; display: grid; place-items: center; color: #62665c; font-size: 11px; }
.workspace-intro { max-width: 690px; padding: 100px 35px; margin: auto; text-align: center; }
.workspace-intro h1 { font-size: 48px; font-weight: 500; letter-spacing: -.06em; margin: 18px 0; }
.workspace-intro p { color: var(--muted); line-height: 1.6; }
.background-upload { padding: 38px; margin-top: 38px; border: 1px dashed #bfc3b5; border-radius: 12px; background: #fafaf7; }
.background-upload .icon { width: 28px; height: 28px; }
.background-upload strong { display: block; margin-top: 12px; font-size: 15px; font-weight: 500; }
.mock-label { font-size: 12px !important; }
.button { display: inline-flex; justify-content: center; align-items: center; gap: 9px; padding: 12px 17px; min-height: 44px; border: 1px solid var(--line); background: white; border-radius: 7px; font-size: .875rem; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .18s, border-color .18s, transform .18s; }
.button:hover:not(:disabled) { background: #f1f3ec; border-color: #c3c9b8; }
.button:active:not(:disabled) { transform: translateY(1px); }
.button.primary { background: var(--accent); border-color: var(--accent); }
.button.primary:hover:not(:disabled) { background: #acf32c; border-color: #acf32c; }
.button:disabled { opacity: .45; }
.button.dark { background: var(--dark); border-color: var(--dark); color: white; }
.text-button { border: 0; padding: 7px 0; background: transparent; color: var(--muted); font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }
.icon-button { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 50%; color: var(--muted); background: transparent; padding: 0; }
.icon-button:hover { background: #eaede3; color: var(--ink); }
.run-dialog { width: min(1160px, calc(100vw - 64px)); max-width: none; max-height: none; padding: 0; border: 0; background: transparent; overflow: visible; color: var(--ink); }
.run-dialog::backdrop { background: #25282069; backdrop-filter: blur(5px); animation: backdrop-in .35s ease-out both; }
.run-panel { background: var(--bg); border: 1px solid #ffffffaa; border-radius: 15px; box-shadow: 0 28px 90px #19201038, 0 3px 12px #19201012; height: min(785px, calc(100dvh - 112px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.run-dialog[open] .run-panel { animation: popup-in .46s var(--ease) both; }
.run-heading { padding: 25px 30px 21px; background: #fafaf6; flex-shrink: 0; }
.heading-line { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.heading-controls { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.heading-line h2 { margin: 0; font: 500 clamp(26px, 2.65vw, 34px)/1.2 "Playfair Display", Georgia, serif; letter-spacing: -.045em; }
.heading-line h2:focus { outline: none; }
.heading-description { margin: 9px 0 0; color: var(--muted); font-size: .875rem; line-height: 1.5; }
.state-badge { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; padding: 6px 10px; background: #eaf3db; color: var(--green); border-radius: 30px; font-size: .75rem; font-weight: 500; }
.state-badge .icon { width: 13px; height: 13px; }
.state-badge.processing { color: #687047; background: #eeefe4; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }
.run-metrics { display: grid; grid-template-columns: repeat(4, 1fr); padding: 17px 30px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #f2f3ec; flex-shrink: 0; }
.metric { display: flex; align-items: center; gap: 10px; padding: 0 20px; border-right: 1px solid #dce0d3; }
.metric:first-child { padding-left: 0; }
.metric:last-child { border-right: 0; }
.metric .icon { color: #848a7a; width: 17px; height: 17px; }
.metric strong { font-size: 19px; letter-spacing: -.04em; font-weight: 500; }
.metric span { color: var(--muted); font-size: .8125rem; }
.metric.rejected .icon { color: #a3715e; }
.run-body { display: grid; grid-template-columns: 226px minmax(0,1fr); min-height: 0; flex: 1; }
.product-rail { padding: 22px 13px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.rail-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 9px 2px; }
.rail-heading span:last-child { font-size: 12px; color: #969b90; }
.product-list { display: grid; gap: 7px; }
.product-card { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; border: 1px solid transparent; padding: 9px; border-radius: 9px; background: transparent; transition: background .2s, border-color .2s; }
.product-card:hover { background: #edeee6; }
.product-card[aria-pressed="true"] { background: white; border-color: #c7cebc; box-shadow: 0 2px 5px #20261505; }
.card-image { width: 48px; height: 60px; flex-shrink: 0; border-radius: 5px; overflow: hidden; background: #e4e5dc; position: relative; }
.card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbnail-approved { position: absolute; right: 3px; bottom: 3px; z-index: 1; display: grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid #fff; border-radius: 50%; background: #48651d; color: #fff; box-shadow: 0 1px 4px #1d351b2e; pointer-events: none; }
.thumbnail-approved .icon { width: 10px; height: 10px; stroke-width: 2.6; }
.card-copy { min-width: 0; }
.card-number { display: block; color: #777d6e; font-size: 10px; letter-spacing: .07em; margin-bottom: 3px; }
.card-name { font-size: .8125rem; line-height: 1.25; font-weight: 500; display: block; overflow-wrap: anywhere; }
.card-meta { margin-top: 5px; display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
.card-meta.approved { color: var(--green); }
.card-meta .icon { width: 11px; height: 11px; }
.rejected-shortcut { border-top: 1px solid var(--line); padding-top: 15px; margin-top: auto; }
.rejected-shortcut button { display: flex; align-items: center; gap: 9px; background: #f0ebe4; padding: 11px; border: 1px solid transparent; border-radius: 7px; width: 100%; text-align: left; color: #80604d; }
.rejected-shortcut button:hover, .rejected-shortcut button[aria-pressed="true"] { border-color: #d4c5b3; background: #eee6dc; }
.rejected-shortcut .icon { width: 16px; height: 16px; }
.rejected-shortcut b { font-size: .75rem; font-weight: 500; display: block; }
.rejected-shortcut small { display: block; font-size: 11px; margin-top: 3px; color: #927e6e; }
.product-detail { min-width: 0; overflow-y: auto; position: relative; padding: 21px 27px 25px; scrollbar-width: thin; scrollbar-color: #cfd4c5 transparent; }
.detail-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; }
.detail-heading-left { display: flex; align-items: center; gap: 12px; }
.detail-heading .eyebrow { color: #52594b; }
.product-content { display: grid; grid-template-columns: minmax(160px, .78fr) minmax(0, 1.5fr); gap: 25px; align-items: start; }
.gallery { min-width: 0; }
.hero-image { position: relative; width: 100%; aspect-ratio: 4/5; background: #e7e7df; border-radius: 8px; overflow: hidden; }
.hero-image img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s var(--ease), object-position .35s; }
.gallery-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; display: grid; place-items: center; width: 32px; height: 36px; padding: 0; border: 0; border-radius: 0; background: transparent; color: #495041; opacity: .9; transition: opacity .18s; }
.gallery-arrow.previous { left: 7px; }
.gallery-arrow.next { right: 7px; }
.gallery-arrow .icon { width: 13px; height: 16px; stroke-width: 1.8; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 1px 1px #fff9); }
.gallery-arrow:hover, .gallery-arrow:focus-visible { opacity: 1; background: transparent; }
.gallery-arrow:focus-visible { outline: 2px solid #526c2c; outline-offset: 2px; }
@media (pointer: coarse) { .gallery-arrow { width: 44px; height: 44px; } .gallery-arrow.previous { left: 3px; } .gallery-arrow.next { right: 3px; } }
.image-label { position: absolute; bottom: 9px; left: 9px; padding: 4px 7px; border: 1px solid #ffffff70; border-radius: 4px; background: #ffffffd9; font-size: 10px; backdrop-filter: blur(4px); }
.image-fallback { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; background: #e7e7df; }
.image-fallback .icon { justify-self: center; margin-bottom: 8px; }
.thumbnails { display: flex; gap: 7px; margin-top: 9px; }
.thumbnail { width: calc((100% - 21px)/4); aspect-ratio: 1; padding: 0; overflow: hidden; border: 2px solid transparent; border-radius: 5px; background: #e7e7df; }
.thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbnail[aria-pressed="true"] { border-color: #343c2b; box-shadow: 0 0 0 2px var(--bg); }
.category-field { display: block; margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line); }
.category-field > span { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: .8125rem; }
.category-field .icon { width: 12px; height: 12px; color: #8a907f; }
.category-field input { width: 100%; min-width: 0; padding: 8px 0 0; border: 0; border-radius: 0; background: transparent; font-size: .875rem; color: #4f5745; cursor: default; }
.category-hint { display: block; font-size: 10px; color: #8d9286; margin-top: 5px; }
.product-form { min-width: 0; margin: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 12px; }
.field { display: grid; align-content: start; gap: 5px; min-width: 0; }
.field.full { grid-column: 1/-1; }
.field > span { color: #62685b; font-size: .8125rem; }
.field input, .field textarea { width: 100%; min-width: 0; color: #252a20; font-size: .875rem; padding: 10px 11px; border: 1px solid #dde1d5; border-radius: 6px; background: #fff; line-height: 1.4; transition: border-color .2s, box-shadow .2s; }
.field textarea { resize: vertical; min-height: 60px; }
.field .description { min-height: 111px; }
.field input:hover, .field textarea:hover { border-color: #bfc7b1; }
.field input:focus, .field textarea:focus { outline: none; border-color: #859767; box-shadow: 0 0 0 3px #9cc4631a; }
.field input[aria-invalid="true"] { border-color: #b57765; }
.field input:read-only, .field textarea:read-only { background: #f0f1eb; }
.error-message { margin: 5px 0 0; font-size: 12px; color: var(--red); }
.form-note { display: flex; align-items: center; gap: 5px; margin: 12px 0 0; color: #7a806f; font-size: 11px; }
.form-note .icon { width: 12px; height: 12px; }
.decision-note { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid #d3dfc0; border-radius: 7px; margin-bottom: 15px; background: #edf3e4; color: var(--green); font-size: 12px; line-height: 1.45; }
.decision-note.cancelled { border-color: #e2d8cd; background: #f0ece6; color: #7c6a58; }
.decision-note .text-button { flex-shrink: 0; color: inherit; }
.run-footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 17px 27px; border-top: 1px solid var(--line); background: #fafaf6; flex-shrink: 0; }
.review-progress-label { display: flex; align-items: center; gap: 7px; font-size: .8125rem; color: #535b49; }
.review-progress-label .icon { width: 15px; height: 15px; }
.progress-caption { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 7px; color: #888e80; font-size: 11px; }
.mini-progress { width: 100px; height: 3px; background: #e0e5d7; border-radius: 10px; overflow: hidden; }
.mini-progress span { display: block; height: 100%; background: #819b58; transition: width .3s ease; }
.footer-actions { display: flex; gap: 9px; align-items: center; }
.step-heading { border-bottom: 1px solid var(--line); }
.summary-body, .outputs-body { flex: 1; min-height: 0; overflow-y: auto; padding: 36px 38px; scrollbar-width: thin; scrollbar-color: #cfd4c5 transparent; }
.summary-body { display: flex; flex-direction: column; justify-content: safe center; gap: 24px; }
.approved-grid { display: grid; grid-template-columns: repeat(var(--approved-count), minmax(0, 1fr)); gap: 20px; width: 100%; max-width: calc(var(--approved-count) * 240px); padding: 0; margin: 0 auto; list-style: none; }
.approved-card { min-width: 0; }
.approved-photo { position: relative; aspect-ratio: 4/5; overflow: hidden; border-radius: 8px; background: #e7e7df; }
.approved-photo img { width: 100%; height: 100%; display: block; object-fit: cover; }
.approved-photo-badge { position: absolute; right: 10px; bottom: 10px; z-index: 1; width: 24px; height: 24px; display: grid; place-items: center; background: var(--green); color: white; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 2px 6px #24331d1f; }
.approved-photo-badge .icon { width: 13px; height: 13px; stroke-width: 2; }
.approved-card h3 { margin: 13px 0 0; font-size: .875rem; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }
.summary-next { margin: 0; text-align: center; color: var(--muted); font-size: .8125rem; line-height: 1.6; }
.summary-empty { margin: auto; max-width: 340px; text-align: center; color: var(--muted); }
.summary-empty > .icon { width: 36px; height: 36px; color: #879a6e; margin-bottom: 14px; }
.summary-empty h3 { color: var(--ink); font: 500 26px/1.3 "Playfair Display", Georgia, serif; letter-spacing: -.035em; margin: 0 0 12px; }
.summary-empty p { font-size: .875rem; line-height: 1.6; margin: 0; }
.step-back { border-color: transparent; background: transparent; color: #626b57; font-weight: 500; }
.step-back .icon { width: 14px; height: 14px; }
.approved-strip { display: flex; flex-wrap: wrap; gap: 14px 26px; padding: 0 0 26px; margin: 0 0 28px; border-bottom: 1px solid var(--line); list-style: none; }
.approved-strip li { display: flex; align-items: center; gap: 10px; max-width: 230px; font-size: .75rem; line-height: 1.45; }
.approved-strip li > span:last-child { overflow-wrap: anywhere; }
.approved-strip .card-image { width: 35px; height: 44px; }
.output-fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.output-fieldset legend { padding: 0; font-size: 1rem; font-weight: 500; }
.output-hint { margin: 7px 0 19px; font-size: .8125rem; color: var(--muted); }
.output-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
.output-option { position: relative; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 23px; border: 1px solid #dce0d5; border-radius: 9px; background: #fafaf6; cursor: pointer; transition: border-color .2s, background .2s; }
.output-option:hover { border-color: #aebc9a; }
.output-option.selected { border-color: #8ba566; background: #edf3e4; }
.output-option input { position: absolute; top: 20px; right: 19px; width: 17px; height: 17px; margin: 0; accent-color: var(--green); cursor: pointer; }
.output-option input:focus-visible { outline: 2px solid #526c2c; outline-offset: 4px; }
.output-option-icon { display: grid; place-items: center; width: 35px; height: 35px; margin-bottom: 18px; color: #768963; }
.output-option-icon .icon { width: 28px; height: 28px; stroke-width: 1.25; }
.output-option-name { font-size: .9375rem; font-weight: 500; }
.output-option-description { margin-top: 7px; color: var(--muted); font-size: .8125rem; line-height: 1.55; }
.output-preview-note { font-size: .75rem; color: var(--muted); margin: 19px 0 0; }
.output-count { font-size: .75rem; color: var(--muted); }
.generation-notice { background: #edf3e4; color: #50663c; border: 1px solid #d6e0c9; border-radius: 7px; font-size: .8125rem; line-height: 1.6; padding: 13px 15px; margin: 17px 0 0; }
.screen-transition > * { animation: step-in .34s var(--ease) both; }
.screen-transition .approved-card { animation: step-in .4s var(--ease) both; animation-delay: calc(.05s + var(--card-index) * .045s); }
@keyframes step-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.confirmation { position: absolute; z-index: 3; top: 57px; right: 24px; width: min(302px, calc(100% - 36px)); padding: 17px; border: 1px solid #d6dace; background: #fffefb; border-radius: 9px; box-shadow: 0 12px 32px #27301e22; animation: notice-in .2s var(--ease) both; }
.confirmation::before { content: ""; position: absolute; right: 13px; top: -5px; width: 8px; height: 8px; background: #fffefb; border-left: 1px solid #d6dace; border-top: 1px solid #d6dace; transform: rotate(45deg); }
.confirmation h3 { margin: 0; font-size: 15px; font-weight: 600; }
.confirmation p { margin: 8px 0 14px; font-size: 12px; color: var(--muted); line-height: 1.55; }
.confirmation-actions { display: flex; justify-content: flex-end; gap: 7px; }
.confirmation .button { min-height: 36px; padding: 8px 11px; font-size: 12px; }
.confirmation .cancel-confirm { background: #f1ebe4; color: #785441; border-color: #e3d8ca; }
.loading-body { flex: 1; display: flex; flex-direction: column; padding: 28px 40px; min-height: 0; overflow-y: auto; }
.batch-progress { width: 100%; max-width: 960px; min-height: 245px; flex: 1; display: flex; flex-direction: column; justify-content: center; margin: 0 auto; }
.loading-thumbnails { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); flex: 1; min-height: 170px; max-height: 300px; gap: 22px; width: 100%; margin: 0 0 25px; }
.loading-thumbnail { position: relative; display: grid; place-items: center; min-width: 0; overflow: hidden; background: #eceee7; border: 1px solid #dce1d3; border-radius: 9px; }
.loading-thumbnail:nth-child(2) { background: #f0f2ea; border-color: #cfd7c3; }
.loading-thumbnail .icon { width: 34px; height: 34px; color: #bac3ac; stroke-width: 1.2; }
.loading-thumbnail::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 15%, #ffffff9e 50%, transparent 85%); transform: translateX(-125%); animation: thumbnail-shimmer 2.8s ease-in-out infinite; animation-delay: calc(var(--thumbnail-index) * .3s); }
.loading-progress-details { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.loading-status { display: flex; align-items: center; gap: 9px; }
.loading-status h3 { margin: 0; font-size: 1rem; line-height: 1.4; font-weight: 500; color: #505d43; }
.status-spinner { display: inline-block; width: 14px; height: 14px; flex-shrink: 0; border: 1.5px solid #dce2d1; border-top-color: #718754; border-radius: 50%; animation: spin 1.3s linear infinite; }
.processing-row { display: flex; justify-content: space-between; gap: 16px; color: #717b65; font-size: .8125rem; font-variant-numeric: tabular-nums; }
#processing-percent { color: #43532e; font-weight: 500; }
.processing-track { margin-top: 10px; height: 5px; border-radius: 20px; overflow: hidden; background: #e2e7d9; }
.processing-track span { display: block; height: 100%; background: #8cac5a; border-radius: inherit; transition: width .5s var(--ease); }
@keyframes thumbnail-shimmer { 0% { transform: translateX(-125%); } 65%, 100% { transform: translateX(125%); } }
.rejection-view h3 { margin: 4px 0 9px; font: 500 27px/1.2 "Playfair Display", Georgia, serif; letter-spacing: -.04em; }

    const field = (name, label, textarea = false, full = true) => `<label class="field ${full ? 'full' : ''}" for="field-${name}"><span>${label}</span>${textarea ? `<textarea id="field-${name}" name="${name}" data-field="${name}" class="${name === 'description' ? 'description' : ''}" rows="${name === 'description' ? 4 : 2}" ${locked ? 'readonly' : ''}>${esc(product[name])}</textarea>` : `<input id="field-${name}" name="${name}" data-field="${name}" value="${esc(product[name])}" ${name === 'name' ? 'required maxlength="160" aria-describedby="name-error"' : 'maxlength="400"'} ${locked ? 'readonly' : ''}>`}</label>`;
    return `<section class="product-detail" id="product-detail" aria-label="Selected product details"><div class="detail-heading"><div class="detail-heading-left"><span class="eyebrow">Product ${String(product.id).padStart(2, '0')} / 04</span></div><button type="button" class="icon-button" data-action="ask-cancel" aria-label="Cancel product ${product.id}" title="Cancel this product" ${locked ? 'disabled' : ''}>${icon('close')}</button></div>${locked ? `<div class="decision-note ${product.status}"><span>${product.status === 'approved' ? 'Approved for the Product Library in this mock run.' : `${product.status === 'cancelled' ? 'Cancelled' : 'Rejected'} — kept in this run, excluded from the library.`}</span><button class="text-button" type="button" data-action="undo-decision">Change decision</button></div>` : ''}<div class="product-content"><div class="gallery"><div class="hero-image"><img id="hero-photo" src="${product.photo}" alt="${esc(product.name)}, mock view ${product.view + 1}" style="${photoStyles(product.view)}"><span class="image-label" id="image-view-label">Image ${product.view + 1} of ${product.count}</span>${product.count > 1 ? `<button type="button" class="gallery-arrow previous" data-action="previous-image" aria-label="Previous image" aria-controls="hero-photo">${icon('chevronLeft')}</button><button type="button" class="gallery-arrow next" data-action="next-image" aria-label="Next image" aria-controls="hero-photo">${icon('chevronRight')}</button>` : ''}</div><div class="thumbnails" aria-label="Grouped product images">${Array.from({length: product.count}, (_, index) => `<button class="thumbnail" type="button" data-view="${index}" aria-label="View image ${index + 1} of ${esc(product.name)}" aria-pressed="${product.view === index}"><img src="${product.photo}" alt="" style="${photoStyles(index)}"></button>`).join('')}</div><label class="category-field" for="category"><span>Category ${icon('lock')}</span><input id="category" value="${esc(product.category)}" readonly aria-readonly="true" aria-describedby="category-hint"><small class="category-hint" id="category-hint">Read-only classification</small></label></div><form class="product-form" id="product-form"><div class="fields">${field('name', 'Product name')}${field('type', 'Product type')}${field('colours', 'Colours', false, false)}${field('materials', 'Materials', false, false)}${field('features', 'Features', true)}${field('description', 'Description', true)}</div><p class="error-message" id="name-error" hidden>Please give this product a name.</p><p class="form-note">${icon('sparkle')}Suggested details. Your approval makes them final.</p></form></div><div id="confirmation-slot"></div></section>`;
  }

  function rejectionDetail() {
    return `<section class="product-detail rejection-view" id="product-detail" aria-label="Rejected image details"><h3>Products that didn’t quite fit</h3><p>Your other 14 images are ready. We couldn’t use this one.</p><article class="rejection-card"><div class="rejection-photo"><img src="${rejectedImage.photo}" alt="Mock rejected upload showing a skincare product"></div><div><span class="eyebrow">Image ${rejectedImage.number}</span><h4>${rejectedImage.filename}</h4><p><span class="reason-label">Reason:</span> <span id="rejection-reason">${rejectedImage.reason}</span></p></div></article><div class="rejection-explainer">${icon('image')}<span>Try clear, well-lit photos of clothing, shoes, bags or fashion accessories.</span></div></section>`;
  }

  function footer() {
    if (mode === 'loading') return `<footer class="run-footer"><div class="review-progress-label">${icon('clock')}<span>Review is up next</span></div><div class="footer-actions"><button class="button" type="button" data-action="finish-demo">Skip to completed preview →</button></div></footer>`;
    const { reviewed, total, approved, cancelled, complete } = reviewStats();
    const label = total === 0 ? 'All products cancelled' : `${reviewed} of ${total} products reviewed`;
    const decisionSummary = `${approved} approved${cancelled ? ` · ${cancelled} cancelled` : ''}`;
    const progress = total ? `<div class="mini-progress" role="progressbar" aria-label="Products reviewed" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${reviewed}" aria-valuetext="${label}${cancelled ? `, ${cancelled} cancelled` : ''}"><span style="width:${reviewed / total * 100}%"></span></div>` : '';
    return `<footer class="run-footer"><div class="review-progress"><div class="review-progress-label">${icon(total === 0 ? 'close' : complete ? 'check' : 'layers')}<span>${label}</span></div><div class="progress-caption">${progress}<span>${decisionSummary}</span></div></div><div class="footer-actions">${showingRejected ? `<button class="button" type="button" data-action="back-to-products">Back to products ${icon('arrow')}</button>` : complete ? '<button class="button primary" type="button" data-action="finish-review">Done reviewing ✓</button>' : `<button class="button primary" type="button" data-action="approve" ${selectedProduct().status !== 'pending' ? 'disabled' : ''}>${icon('check')}Approve product</button>`}</div></footer>`;
  }

  function stepHeader(title, description, badge) {
    return `<header class="run-heading step-heading"><div class="heading-line"><h2 id="run-title" tabindex="-1">${title}</h2><div class="heading-controls"><span class="state-badge">${icon('check')}${badge}</span><button type="button" class="icon-button" data-action="close-review" aria-label="Close review" title="Close preview; keep mock decisions">${icon('close')}</button></div></div><p class="heading-description" id="run-description">${description}</p></header>`;
  }

  function approvedSummary() {
    const approved = approvedProducts();
    const count = approved.length;
    const description = count ? `${count} approved ${count === 1 ? 'product' : 'products'}. A final look before you bring ${count === 1 ? 'it' : 'them'} to life.` : 'Head back to review to choose the pieces you’d like to work with.';
    const cards = approved.map((product, index) => `<li class="approved-card" style="--card-index:${index}"><div class="approved-photo"><img src="${product.photo}" alt="" loading="eager"><span class="approved-photo-badge" aria-label="Approved">${icon('check')}</span></div><h3>${esc(product.name)}</h3></li>`).join('');
    return stepHeader(count ? 'Your edit is ready' : 'No products approved', description, 'Review complete') + `<section class="summary-body" aria-label="Approved products">${count ? `<ul class="approved-grid" style="--approved-count:${count}">${cards}</ul><p class="summary-next">The pieces are picked. Let’s set the scene.</p>` : `<div class="summary-empty">${icon('layers')}<h3>A fresh edit starts here.</h3><p>All four products were cancelled. You can change any decision in the review.</p></div>`}</section><footer class="run-footer step-footer"><button class="button step-back" type="button" data-action="back-to-review">${icon('chevronLeft')}Back to review</button>${count ? `<button class="button primary" type="button" data-action="produce-outputs">Produce outputs ${icon('arrow')}</button>` : ''}</footer>`;
  }

  function outputStep() {
    const approved = approvedProducts();
    return stepHeader('Produce outputs', 'Choose how your products take the spotlight.', 'Products approved') + `<section class="outputs-body" aria-label="Output options"><ul class="approved-strip" aria-label="Approved products for outputs">${approved.map(product => `<li><span class="card-image"><img src="${product.photo}" alt=""></span><span>${esc(product.name)}</span></li>`).join('')}</ul><fieldset class="output-fieldset"><legend>What would you like to create?</legend><p class="output-hint" id="output-hint">Choose one or more styles for your ${approved.length === 1 ? 'product' : 'products'}.</p><div class="output-options">${outputOptions.map(option => `<label class="output-option${selectedOutputTypes.has(option.id) ? ' selected' : ''}"><input type="checkbox" data-output="${option.id}" ${selectedOutputTypes.has(option.id) ? 'checked' : ''} aria-labelledby="output-${option.id}-name" aria-describedby="output-${option.id}-description"><span class="output-option-icon" aria-hidden="true">${icon(option.icon)}</span><span class="output-option-name" id="output-${option.id}-name">${option.name}</span><span class="output-option-description" id="output-${option.id}-description">${option.description}</span></label>`).join('')}</div></fieldset><p class="output-preview-note">Mock preview only. No images or files will be generated.</p><p class="generation-notice" id="generation-notice" hidden></p></section><footer class="run-footer step-footer"><button class="button step-back" type="button" data-action="back-to-approved">${icon('chevronLeft')}Your approved products</button><div class="footer-actions output-actions"><span class="output-count" id="output-count">${selectedOutputTypes.size} selected</span><button class="button primary" type="button" data-action="preview-generation" ${selectedOutputTypes.size ? '' : 'disabled'}>Preview generation ${icon('arrow')}</button></div></footer>`;
  }

  function goToScreen(next) {
    if (mode === 'loading' || next === reviewScreen) return;
    if (next === 'approved' && (!reviewStats().complete || !['review', 'outputs'].includes(reviewScreen))) return;
    if (next === 'outputs' && (reviewScreen !== 'approved' || !reviewStats().complete || !approvedProducts().length)) return;
    if (!['review', 'approved', 'outputs'].includes(next)) return;
    closeConfirmation(false);
    clearTimeout(toastTimer);
    document.getElementById('toast').hidden = true;
    reviewScreen = next;
    showingRejected = false;
    render(true);
    if (dialog.open) document.getElementById('run-title').focus({ preventScroll: true });
    const count = approvedProducts().length;
    announce(next === 'review' ? 'Back to review. Your edits and decisions are unchanged.' : next === 'approved' ? `${count} approved ${count === 1 ? 'product' : 'products'} ready to view.` : 'Choose your output styles. This is a mock preview only.');
  }

  function loadingBody() {
    return `<section class="loading-body" aria-label="Batch analysis"><div class="batch-progress"><div class="loading-thumbnails" aria-hidden="true">${Array.from({ length: 3 }, (_, index) => `<div class="loading-thumbnail" style="--thumbnail-index:${index}">${icon('image')}</div>`).join('')}</div><div class="loading-progress-details"><div class="loading-status"><span class="status-spinner" aria-hidden="true"></span><h3 id="processing-message">Checking your images</h3></div><div class="processing-row"><span id="processing-count">0 of ${uploadCount} images checked</span><span id="processing-percent">0%</span></div></div><div class="processing-track" role="progressbar" aria-label="Overall analysis progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="processing-fill" style="width:0%"></span></div></div></section>`;
  }

  function render(animate = false) {
    panel.dataset.screen = reviewScreen;
    panel.classList.toggle('screen-transition', animate);
    panel.innerHTML = reviewScreen === 'approved' ? approvedSummary() : reviewScreen === 'outputs' ? outputStep() : header() + (mode === 'loading' ? loadingBody() : `<div class="run-body">${rail()}${showingRejected ? rejectionDetail() : productDetail()}</div>`) + footer();
    document.querySelectorAll('[data-state]').forEach(button => button.setAttribute('aria-pressed', String(reviewScreen === 'review' && button.dataset.state === mode)));
    bindImageFallbacks();
    if (mode === 'loading') updateLoading();
  }

  function bindImageFallbacks() {
    panel.querySelectorAll('img').forEach(image => {
      const fail = () => {
        image.style.visibility = 'hidden';
        if (['hero-image', 'rejection-photo', 'approved-photo'].some(name => image.parentElement.classList.contains(name))) {
          if (!image.parentElement.querySelector('.image-fallback')) image.insertAdjacentHTML('afterend', `<span class="image-fallback">${icon('image')}Reference photo unavailable<br>Connect to the internet to load images.</span>`);
        }
      };
      image.addEventListener('error', fail, { once: true });
      if (image.complete && image.naturalWidth === 0) fail();
    });
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.hidden = false;
    announce(message);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3000);
  }

  function closeConfirmation(restore = true) {
    confirmationId = null;
    const slot = document.getElementById('confirmation-slot');
    if (slot) slot.replaceChildren();
    if (restore) panel.querySelector('[data-action="ask-cancel"]')?.focus({ preventScroll: true });
  }

  function openConfirmation() {
    if (selectedProduct().status !== 'pending') return;
    confirmationId = selectedId;
    document.getElementById('confirmation-slot').innerHTML = `<div class="confirmation" role="alertdialog" aria-labelledby="cancel-title" aria-describedby="cancel-description"><h3 id="cancel-title">Cancel this product?</h3><p id="cancel-description">It will stay in this run, but won’t enter your Product Library.</p><div class="confirmation-actions"><button class="button" type="button" data-action="keep-product">Keep product</button><button class="button cancel-confirm" type="button" data-action="confirm-cancel">Cancel product</button></div></div>`;
    panel.querySelector('[data-action="keep-product"]').focus({ preventScroll: true });
  }

  function makeDecision(status) {
    const product = selectedProduct();
    if (product.status !== 'pending') return;
    if (status === 'approved' && !product.name.trim()) {
      const input = document.getElementById('field-name');
      input.setAttribute('aria-invalid', 'true');
      document.getElementById('name-error').hidden = false;
      input.focus();
      announce('Please give this product a name before approving.');
      return;
    }
    product.name = product.name.trim();
    product.status = status;
    confirmationId = null;
    render();
    panel.querySelector(`[data-product="${selectedId}"]`).focus({ preventScroll: true });
    showToast(`${product.name || 'Untitled product'} ${status}. Preview only.`);
  }

  function updateLoading() {
    if (mode !== 'loading') return;
    const { checked, percent, phase } = batchProgress(loadingStep);
    const stage = loadingPhases[phase];
    document.getElementById('processing-count').textContent = `${checked} of ${uploadCount} images checked`;
    document.getElementById('processing-percent').textContent = `${percent}%`;
    document.getElementById('processing-fill').style.width = `${percent}%`;
    const progress = panel.querySelector('.processing-track');
    progress.setAttribute('aria-valuenow', String(percent));
    progress.setAttribute('aria-valuetext', `${percent}% overall. ${checked} of ${uploadCount} images checked. ${stage.title}.`);
    document.getElementById('metric-passed').textContent = checked ? String(Math.min(checked, uploadCount - 1)) : '—';
    document.getElementById('metric-products').textContent = phase === 2 ? String(products.length) : '—';
    document.getElementById('metric-rejected').textContent = checked === uploadCount ? '1' : '—';
    document.getElementById('processing-message').textContent = stage.title;
    if (announcedPhase !== phase) {
      announcedPhase = phase;
      announce(stage.title + '. ' + stage.detail);
    }
  }

  function startLoading() {
    clearInterval(loadingTimer);
    loadingStep = 0;
    announcedPhase = -1;
    updateLoading();
    loadingTimer = setInterval(() => {
      loadingStep += 1;
      if (loadingStep < 16) updateLoading();
      else {
        clearInterval(loadingTimer);
        loadingTimer = null;
        mode = 'complete'; showingRejected = false; render();
        if (dialog.open) document.getElementById('run-title').focus({ preventScroll: true });
        announce('Analysis complete. 14 images passed validation, 4 unique products identified, 1 rejected image.');
      }
    }, 700);
  }

  function switchState(nextMode) {
    clearInterval(loadingTimer);
    clearTimeout(toastTimer);
    document.getElementById('toast').hidden = true;
    mode = nextMode; selectedId = 1; products = resetProducts(); confirmationId = null;
    reviewScreen = 'review'; selectedOutputTypes.clear();
    loadingStep = 0; announcedPhase = -1; loadingTimer = null;
    showingRejected = nextMode === 'rejected';
    render();
    if (mode === 'loading') startLoading();
    if (mode === 'cancel') openConfirmation();
    announce(`${nextMode === 'cancel' ? 'Cancellation confirmation' : nextMode} mock preview. Changes reset for this preview state.`);
  }

  dialog.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.state) { switchState(button.dataset.state); return; }
    const action = button.dataset.action;
    if (action === 'close-review') { closeConfirmation(false); dialog.close(); document.getElementById('open-review').focus(); return; }
    if (action === 'finish-review') { if (reviewScreen === 'review') goToScreen('approved'); return; }
    if (action === 'back-to-review') { goToScreen('review'); return; }
    if (action === 'produce-outputs') { goToScreen('outputs'); return; }
    if (action === 'back-to-approved') { if (reviewScreen === 'outputs') goToScreen('approved'); return; }
    if (action === 'preview-generation') {
      if (reviewScreen !== 'outputs' || !reviewStats().complete || !approvedProducts().length || !selectedOutputTypes.size) return;
      const notice = document.getElementById('generation-notice');
      const styles = outputOptions.filter(option => selectedOutputTypes.has(option.id)).map(option => option.name).join(', ');
      notice.textContent = `${styles} selected for ${approvedProducts().length} approved ${approvedProducts().length === 1 ? 'product' : 'products'}. This is where generation would start; no files are created in this preview.`;
      notice.hidden = false;
      announce(notice.textContent);
      notice.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (reviewScreen !== 'review') return;
    if (button.dataset.product) {
      selectedId = Number(button.dataset.product); showingRejected = false; confirmationId = null;
      render(); panel.querySelector(`[data-product="${selectedId}"]`).focus({ preventScroll: true }); return;
    }
    if (button.dataset.view !== undefined) { setProductView(Number(button.dataset.view)); return; }
    if (action === 'previous-image' || action === 'next-image') {
      setProductView(selectedProduct().view + (action === 'next-image' ? 1 : -1));
      return;
    }
    if (action === 'ask-cancel') openConfirmation();
    if (action === 'keep-product') closeConfirmation();
    if (action === 'confirm-cancel' && confirmationId === selectedId) makeDecision('cancelled');
    if (action === 'approve') makeDecision('approved');
    if (action === 'undo-decision') { selectedProduct().status = 'pending'; render(); document.getElementById('field-name').focus(); announce('Product is ready for review again.'); }
    if (action === 'show-rejected' || action === 'back-to-products') { showingRejected = action === 'show-rejected'; confirmationId = null; render(); panel.querySelector(showingRejected ? '[data-action="back-to-products"]' : `[data-product="${selectedId}"]`).focus({ preventScroll: true }); }
    if (action === 'finish-demo') {
      switchState('complete');
      document.getElementById('run-title').focus({ preventScroll: true });
    }
  });

  dialog.addEventListener('change', event => {
    const option = event.target.dataset.output;
    if (reviewScreen !== 'outputs' || !outputOptions.some(item => item.id === option)) return;
    if (event.target.checked) selectedOutputTypes.add(option);
    else selectedOutputTypes.delete(option);
    event.target.closest('.output-option').classList.toggle('selected', event.target.checked);
    document.getElementById('output-count').textContent = `${selectedOutputTypes.size} selected`;
    panel.querySelector('[data-action="preview-generation"]').disabled = selectedOutputTypes.size === 0;
    document.getElementById('generation-notice').hidden = true;
  });

  dialog.addEventListener('input', event => {
    const field = event.target.dataset.field;
    if (reviewScreen !== 'review' || !editableFields.has(field) || selectedProduct().status !== 'pending') return;
    selectedProduct()[field] = event.target.value;
    if (field === 'name') {
      const card = panel.querySelector(`[data-product="${selectedId}"]`);
      card.querySelector('.card-name').textContent = event.target.value || 'Untitled product';
      card.setAttribute('aria-label', `Review product ${selectedId}: ${event.target.value || 'Untitled product'}`);
      document.getElementById('hero-photo').alt = `${event.target.value || 'Untitled product'}, mock view ${selectedProduct().view + 1}`;
      panel.querySelectorAll('[data-view]').forEach(thumb => thumb.setAttribute('aria-label', `View image ${Number(thumb.dataset.view) + 1} of ${event.target.value || 'Untitled product'}`));
      event.target.removeAttribute('aria-invalid');
      document.getElementById('name-error').hidden = true;
    }
  });
  dialog.addEventListener('submit', event => event.preventDefault());
  dialog.addEventListener('cancel', event => {
    event.preventDefault();
    if (confirmationId !== null) closeConfirmation();
    else { dialog.close(); document.getElementById('open-review').focus(); }
  });
  dialog.addEventListener('keydown', event => {
    if (confirmationId === null || event.key !== 'Tab') return;
    const choices = [...panel.querySelectorAll('.confirmation button')];
    event.preventDefault();
    const current = choices.indexOf(document.activeElement);
    const next = (current + (event.shiftKey ? -1 : 1) + choices.length) % choices.length;
    choices[next].focus();
  });
  document.getElementById('open-review').addEventListener('click', () => {
    dialog.showModal();
    document.getElementById('run-title').focus({ preventScroll: true });
    if (mode === 'loading' && !loadingTimer) startLoading();
  });
  document.getElementById('replay-opening').addEventListener('click', () => {
    panel.style.animation = 'none';
    requestAnimationFrame(() => requestAnimationFrame(() => { panel.style.animation = ''; }));
  });
  render();
  dialog.showModal();
  document.getElementById('run-title').focus({ preventScroll: true });
  if (mode === 'loading') startLoading();
  else if (mode === 'cancel') openConfirmation();
})();
  </script>
</body>
</html>
