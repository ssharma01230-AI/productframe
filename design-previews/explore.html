const resetEl=document.querySelector('#reset');
resetEl.onclick=()=>{selectedCategory='All categories';selectedFamily='All families';searchEl.value='';render();searchEl.focus()};
// Preview-only grouping: application taxonomy and recipe routing are unchanged.
const supportedTypes={
 Shoes:['Trainers','Loafers','Flats','Sandals','Formal shoes','Sliders','Flat mules','Clogs','Crocs-style shoes'],
 Heels:['Court shoes','Heeled sandals','Heeled mules','Heeled pumps']
};
const categoryTypes={
 footwear:[...supportedTypes.Shoes,...supportedTypes.Heels],
 bottoms:['Casual trousers','Jeans','Joggers','Leggings','Shorts','Skirts'],
 outerwear:['Jackets','Coats','Gilets','Padded vests'],
 tops:['T-shirts','Casual tops','Shirts','Hoodies','Knitwear','Sleeveless tops'],
 socks:['Socks'],
 underwear:['Briefs','Boxers','Boxer briefs','Trunks','Thongs']
};
function bindCompatibility(){
 document.querySelectorAll('.category-compatibility').forEach(wrap=>{
 const button=wrap.querySelector('button'),panel=wrap.querySelector('[role="tooltip"]');
 const setOpen=open=>{panel.hidden=!open;button.setAttribute('aria-expanded',String(open))};
 let timer;
 wrap.onpointerenter=e=>{if(e.pointerType==='mouse'){clearTimeout(timer);setOpen(true)}};
 wrap.onpointerleave=e=>{if(e.pointerType==='mouse')timer=setTimeout(()=>{if(!wrap.contains(document.activeElement))setOpen(false)},160)};
 button.onclick=e=>setOpen(e.pointerType==='mouse' ? true : panel.hidden);
 button.onfocus=()=>{if(button.matches(':focus-visible'))setOpen(true)};
 wrap.onfocusout=e=>{if(!wrap.contains(e.relatedTarget))setOpen(false)};
 wrap.onkeydown=e=>{if(e.key==='Escape'){clearTimeout(timer);setOpen(false);e.stopPropagation()}};
 });
}
document.addEventListener('pointerdown',e=>{
 document.querySelectorAll('.category-compatibility').forEach(wrap=>{
 if(!wrap.contains(e.target)){wrap.querySelector('[role="tooltip"]').hidden=true;wrap.querySelector('button').setAttribute('aria-expanded','false')}
 });
});
function render(){const q=searchEl.value.trim().toLowerCase();
 categoryEl.querySelectorAll('button').forEach(b=>{const active=b.dataset.category===selectedCategory;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});
 resetEl.hidden=selectedCategory==='All categories'&&selectedFamily==='All families'&&!q;const visible=data.filter(x=>(selectedCategory==='All categories'||x.category===selectedCategory)&&(selectedFamily==='All families'||x.family===selectedFamily)&&(`${x.name} ${x.family} ${x.category}`.toLowerCase().includes(q)));const families=[...new Set(data.filter(x=>selectedCategory==='All categories'||x.category===selectedCategory).map(x=>x.family))];familyEl.innerHTML='';[['All families','All families'],...families.map(x=>[x,x])].forEach(([label,value])=>{const b=document.createElement('button');b.textContent=label;b.className=value===selectedFamily?'active':'';b.type='button';b.setAttribute('aria-pressed',value===selectedFamily);b.onclick=()=>{selectedFamily=value;render();[...familyEl.children].find(el=>el.textContent===label)?.focus()};familyEl.append(b)});document.querySelector('#total').textContent=data.length;document.querySelector('#count').innerHTML=`<strong>${visible.length}</strong> ${visible.length===1?'template':'templates'}${selectedFamily!=='All families'?' in '+selectedFamily:selectedCategory!=='All categories'?' in '+clean(selectedCategory):' to explore'}`;const cats=[...new Set(visible.map(x=>x.category))];document.querySelector('#library').innerHTML=cats.map(cat=>{const fam=[...new Set(visible.filter(x=>x.category===cat).map(x=>x.family))];return `<section class="category"><header class="category-head"><div class="category-title"><h2>${clean(cat)}</h2><div class="category-compatibility"><button type="button" class="compatibility-trigger" aria-label="Templates suitable for ${clean(cat)}" aria-describedby="suitability-${cat}" aria-controls="suitability-${cat}" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg></button><div class="compatibility-popover" id="suitability-${cat}" role="tooltip" hidden><strong>Templates suitable for</strong><p class="supported-list">${categoryTypes[cat].join(' · ')}</p></div></div></div><span>${visible.filter(x=>x.category===cat).length} templates</span></header>${fam.map(f=>{const items=visible.filter(x=>x.category===cat&&x.family===f);return `<div class="family"><header class="family-head"><h3>${f}</h3><span>${items.length} views</span></header><div class="grid">${items.map(x=>`<article class="card"><div class="image"><img src="../apps/web/public/output-examples/${x.path}" alt="${x.family}: ${x.name}" loading="lazy" decoding="async"></div><div class="copy"><h4>${x.name}</h4><p>${x.family} · Ecommerce</p></div></article>`).join('')}</div></div>`}).join('')}</section>`}).join('');if(!visible.length) document.querySelector('#library').innerHTML='<div class="empty"><h2>No matching templates</h2><p>Try another search or clear your filters to explore the full library.</p></div>';bindCompatibility()}
searchEl.oninput=render;render();
</script></body></html>
